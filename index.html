<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könyvkezelő</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <header class="page-header">
            <p class="eyebrow">Személyes könyvtár</p>
            <h1>Könyvkezelő</h1>
            <p class="page-intro">Tartsd rendben a könyveidet és a kölcsönzéseket.</p>
        </header>

        <section class="controls" aria-labelledby="add-book-heading">
            <h2 id="add-book-heading">Új könyv hozzáadása</h2>
            <div class="book-form">
                <label for="input1">Cím<input type="text" id="input1"></label>
                <label for="input2">Szerző<input type="text" id="input2"></label>
                <label for="input3">Kiadás éve<input type="number" id="input3"></label>
                <label for="input4">Oldalszám<input type="number" id="input4"></label>
                <div class="form-actions">
                    <button onclick="hozzaadas()">Hozzáadás</button>
                    <button onclick="szures1()" id="buttonSzures1" class="button-secondary">Szűrés</button>
                </div>
            </div>
        </section>

        <section class="library" aria-label="Könyvek listája">
            <div id="elemTabla"></div>
        </section>

        <aside id="statisztikaDiv" aria-label="Könyvtár statisztikák"></aside>
    </main>

    <script src="kód.js"></script>
</body>
</html>
