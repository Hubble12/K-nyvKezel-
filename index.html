<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Könyvkezelő</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-shell">
        <header class="page-header">
            <p class="eyebrow"></p>
            <h1>Könyvkezelő</h1>
            <p class="page-intro"></p>
        </header>

        <section class="controls" aria-labelledby="add-book-heading">
            <h2 id="add-book-heading">Új könyv hozzáadása</h2>
            <div class="book-form">
                <label for="input1">Cím<input type="text" id="input1"></label>
                <label for="input2">Szerző<input type="text" id="input2"></label>
                <label for="input3">Kiadás éve<input type="number" id="input3"></label>
                <label for="input4">Oldalszám<input type="number" id="input4"></label>
                <label for="input5">Műfaj
                    <select id="input5">
                        <option value="" disabled selected>Válassz műfajt</option>
                        <option value="Regény">Regény</option>
                        <option value="Történelmi regény">Történelmi regény</option>
                        <option value="Vers">Vers</option>
                        <option value="Fantasy">Fantasy</option>
                        <option value="Krimi">Krimi</option>
                        <option value="Sci-fi">Sci-fi</option>
                        <option value="Egyéb">Egyéb</option>
                    </select>
                </label>
                <div class="form-actions">
                    <button onclick="hozzaadas()">Hozzáadás</button>
                    <button onclick="szures1()" id="buttonSzures1" class="button-secondary">Szűrés</button>
                </div>
            </div>
        </section>

        <section class="library" aria-label="Könyvek listája">
            <label class="genre-filter" for="genreFilter">Műfaj szerinti szűrés
                <select id="genreFilter" onchange="feltoltes()">
                    <option value="">Minden műfaj</option>
                </select>
            </label>
            <div id="elemTabla"></div>
        </section>

        <aside id="statisztikaDiv" aria-label="Könyvtár statisztikák"></aside>
    </main>

    <script src="kód.js"></script>
</body>
</html>
